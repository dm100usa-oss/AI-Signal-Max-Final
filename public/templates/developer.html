    @page {

        font-size: 10pt;
        color: rgb(107,114,128);
      }
    }
    @page:first { @bottom-center { content: ""; } }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }
    body {
      font-family: Helvetica, Arial, sans-serif;
      color: rgb(15,23,42);
      line-height: 1.6;
      font-size: 12pt;
      position: relative;

    .center { text-align: center; }
    .logo { display: block; margin: 0 auto; width: 160px; }
    h1 { font-size: 22pt; text-align: center; margin: 10px 0 0; font-weight: 700; }
    .meta { text-align: center; font-size: 11pt; color: rgb(55,65,81); margin-top: 8px; }

    h2 { font-size: 14pt; margin-top: 26px; font-weight: 700; color: rgb(15,23,42); }
    p { margin: 8px 0; color: rgb(15,23,42); }

    .factor {
      margin-top: 14px;
      padding: 12px 16px;
      border: 1px solid rgb(229,231,235);
      border-radius: 10px;
      background: #fff;
    }
    .factor-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      margin-bottom: 6px;
    }
    .factor-lead { display: flex; align-items: center; gap: 8px; }
    .factor-lead.good { color: rgb(16,185,129); }
    .factor-lead.moderate { color: rgb(245,158,11); }
    .factor-lead.poor { color: rgb(239,68,68); }

    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid currentColor;
      background: #fff;
      display: inline-block;
      box-sizing: border-box;
    }

    .factor-name { font-weight: 700; font-size: 12.5pt; color: rgb(15,23,42); }
    .status { font-weight: 700; font-size: 11pt; }
    .status.good { color: rgb(16,185,129); }
    .status.moderate { color: rgb(245,158,11); }
    .status.poor { color: rgb(239,68,68); }

      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10pt;
      color: rgb(55,65,81);
      line-height: 1.4;
    }
